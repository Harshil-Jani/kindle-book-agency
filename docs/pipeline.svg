<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -15 1090 280" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 7" refX="10" refY="3.5" markerWidth="8" markerHeight="6" orient="auto-start-auto">
      <path d="M 0 0 L 10 3.5 L 0 7 z" fill="#4B5563"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Explicit white background for dark-mode compatibility -->
  <rect x="-20" y="-15" width="1090" height="280" rx="16" fill="#FFFFFF"/>

  <!-- Phase background bands -->
  <rect x="-5" y="0" width="135" height="255" rx="12" fill="#DBEAFE" opacity="0.6"/>
  <rect x="145" y="0" width="210" height="255" rx="12" fill="#D1FAE5" opacity="0.6"/>
  <rect x="370" y="0" width="145" height="255" rx="12" fill="#FEF3C7" opacity="0.6"/>
  <rect x="530" y="0" width="175" height="255" rx="12" fill="#FFE4E6" opacity="0.6"/>
  <rect x="720" y="0" width="145" height="255" rx="12" fill="#E0E7FF" opacity="0.6"/>
  <rect x="880" y="0" width="110" height="255" rx="12" fill="#EDE9FE" opacity="0.6"/>

  <!-- Phase labels -->
  <text x="62" y="22" text-anchor="middle" font-size="11" font-weight="700" fill="#374151">PHASE 0</text>
  <text x="250" y="22" text-anchor="middle" font-size="11" font-weight="700" fill="#374151">PHASE 1</text>
  <text x="442" y="22" text-anchor="middle" font-size="11" font-weight="700" fill="#374151">PHASE 2</text>
  <text x="617" y="22" text-anchor="middle" font-size="11" font-weight="700" fill="#374151">PHASE 3</text>
  <text x="792" y="22" text-anchor="middle" font-size="11" font-weight="700" fill="#374151">PHASE 4</text>

  <!-- Phase 0: Niche Researcher -->
  <g filter="url(#shadow)">
    <rect x="10" y="75" width="105" height="80" rx="10" fill="#BFDBFE" stroke="#2563EB" stroke-width="2"/>
  </g>
  <text x="62" y="100" text-anchor="middle" font-size="10" font-weight="700" fill="#1E3A5F">Niche</text>
  <text x="62" y="113" text-anchor="middle" font-size="10" font-weight="700" fill="#1E3A5F">Researcher</text>
  <text x="62" y="131" text-anchor="middle" font-size="8" font-weight="500" fill="#1D4ED8">Market analysis</text>
  <text x="62" y="143" text-anchor="middle" font-size="8" font-weight="500" fill="#1D4ED8">Keywords &amp; audience</text>

  <!-- Phase 1: Ghostwriter -->
  <g filter="url(#shadow)">
    <rect x="180" y="40" width="140" height="48" rx="10" fill="#A7F3D0" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="250" y="59" text-anchor="middle" font-size="10" font-weight="700" fill="#064E3B">Ghostwriter</text>
  <text x="250" y="76" text-anchor="middle" font-size="8" font-weight="500" fill="#047857">Outline &amp; chapters</text>

  <!-- Phase 1: Cover Designer -->
  <g filter="url(#shadow)">
    <rect x="180" y="98" width="140" height="48" rx="10" fill="#A7F3D0" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="250" y="117" text-anchor="middle" font-size="10" font-weight="700" fill="#064E3B">Cover Designer</text>
  <text x="250" y="134" text-anchor="middle" font-size="8" font-weight="500" fill="#047857">Cover concepts</text>

  <!-- Phase 1: Marketing Specialist -->
  <g filter="url(#shadow)">
    <rect x="180" y="156" width="140" height="48" rx="10" fill="#A7F3D0" stroke="#059669" stroke-width="2"/>
  </g>
  <text x="250" y="175" text-anchor="middle" font-size="10" font-weight="700" fill="#064E3B">Marketing Specialist</text>
  <text x="250" y="192" text-anchor="middle" font-size="8" font-weight="500" fill="#047857">Launch strategy</text>

  <!-- Parallel label Phase 1 -->
  <text x="335" y="125" text-anchor="middle" font-size="8" font-weight="600" font-style="italic" fill="#047857">parallel</text>

  <!-- Phase 2: Developmental Editor -->
  <g filter="url(#shadow)">
    <rect x="385" y="75" width="115" height="80" rx="10" fill="#FDE68A" stroke="#D97706" stroke-width="2"/>
  </g>
  <text x="442" y="100" text-anchor="middle" font-size="10" font-weight="700" fill="#78350F">Developmental</text>
  <text x="442" y="113" text-anchor="middle" font-size="10" font-weight="700" fill="#78350F">Editor</text>
  <text x="442" y="131" text-anchor="middle" font-size="8" font-weight="500" fill="#B45309">Structural review</text>
  <text x="442" y="143" text-anchor="middle" font-size="8" font-weight="500" fill="#B45309">&amp; scoring</text>

  <!-- Phase 3: Proofreader -->
  <g filter="url(#shadow)">
    <rect x="555" y="60" width="125" height="48" rx="10" fill="#FECDD3" stroke="#E11D48" stroke-width="2"/>
  </g>
  <text x="617" y="79" text-anchor="middle" font-size="10" font-weight="700" fill="#881337">Proofreader</text>
  <text x="617" y="96" text-anchor="middle" font-size="8" font-weight="500" fill="#BE123C">Copy editing</text>

  <!-- Phase 3: Formatter -->
  <g filter="url(#shadow)">
    <rect x="555" y="126" width="125" height="48" rx="10" fill="#FECDD3" stroke="#E11D48" stroke-width="2"/>
  </g>
  <text x="617" y="145" text-anchor="middle" font-size="10" font-weight="700" fill="#881337">Formatter</text>
  <text x="617" y="162" text-anchor="middle" font-size="8" font-weight="500" fill="#BE123C">Kindle CSS &amp; layout</text>

  <!-- Parallel label Phase 3 -->
  <text x="693" y="120" text-anchor="middle" font-size="8" font-weight="600" font-style="italic" fill="#BE123C">parallel</text>

  <!-- Phase 4: Kindle Compiler -->
  <g filter="url(#shadow)">
    <rect x="740" y="75" width="105" height="80" rx="10" fill="#C7D2FE" stroke="#4F46E5" stroke-width="2"/>
  </g>
  <text x="792" y="100" text-anchor="middle" font-size="10" font-weight="700" fill="#312E81">Kindle</text>
  <text x="792" y="113" text-anchor="middle" font-size="10" font-weight="700" fill="#312E81">Compiler</text>
  <text x="792" y="131" text-anchor="middle" font-size="8" font-weight="500" fill="#4338CA">Final assembly</text>
  <text x="792" y="143" text-anchor="middle" font-size="8" font-weight="500" fill="#4338CA">&amp; metadata</text>

  <!-- Output: Kindle .docx -->
  <g filter="url(#shadow)">
    <rect x="895" y="88" width="80" height="54" rx="27" fill="#DDD6FE" stroke="#7C3AED" stroke-width="2"/>
  </g>
  <text x="935" y="112" text-anchor="middle" font-size="10" font-weight="700" fill="#4C1D95">Kindle</text>
  <text x="935" y="126" text-anchor="middle" font-size="10" font-weight="700" fill="#4C1D95">.docx</text>

  <!-- Arrows: Researcher -> Phase 1 agents -->
  <line x1="115" y1="95" x2="178" y2="68" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="115" y1="115" x2="178" y2="120" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="115" y1="135" x2="178" y2="175" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Arrow: Ghostwriter -> Dev Editor -->
  <line x1="320" y1="68" x2="383" y2="100" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Arrows: Dev Editor -> Phase 3 agents -->
  <line x1="500" y1="100" x2="553" y2="88" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="130" x2="553" y2="145" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Arrows: Phase 3 agents -> Kindle Compiler -->
  <line x1="680" y1="88" x2="738" y2="100" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="680" y1="148" x2="738" y2="132" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Arrow: Kindle Compiler -> Output -->
  <line x1="845" y1="115" x2="893" y2="115" stroke="#4B5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Agent number badges -->
  <circle cx="22" cy="83" r="9" fill="#2563EB"/>
  <text x="22" y="87" text-anchor="middle" font-size="9" font-weight="700" fill="#FFFFFF">1</text>

  <circle cx="192" cy="48" r="9" fill="#059669"/>
  <text x="192" y="52" text-anchor="middle" font-size="9" font-weight="700" fill="#FFFFFF">2</text>

  <circle cx="192" cy="106" r="9" fill="#059669"/>
  <text x="192" y="110" text-anchor="middle" font-size="9" font-weight="700" fill="#FFFFFF">3</text>

  <circle cx="192" cy="164" r="9" fill="#059669"/>
  <text x="192" y="168" text-anchor="middle" font-size="9" font-weight="700" fill="#FFFFFF">4</text>

  <circle cx="397" cy="83" r="9" fill="#D97706"/>
  <text x="397" y="87" text-anchor="middle" font-size="9" font-weight="700" fill="#FFFFFF">5</text>

  <circle cx="567" cy="68" r="9" fill="#E11D48"/>
  <text x="567" y="72" text-anchor="middle" font-size="9" font-weight="700" fill="#FFFFFF">6</text>

  <circle cx="567" cy="134" r="9" fill="#E11D48"/>
  <text x="567" y="138" text-anchor="middle" font-size="9" font-weight="700" fill="#FFFFFF">7</text>

  <circle cx="752" cy="83" r="9" fill="#4F46E5"/>
  <text x="752" y="87" text-anchor="middle" font-size="9" font-weight="700" fill="#FFFFFF">8</text>

  <!-- Bottom legend -->
  <text x="0" y="245" font-size="9" font-weight="500" fill="#4B5563">Each phase completes before the next begins. Agents within the same phase run in parallel.</text>
</svg>
